name: Processar Feed XML
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  process-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Processar feed
        run: python script.py
      - name: Mesclar JSON
        run: python merge_json.py
      - name: Verificar
        run: |
          ls -lh json_parts/
          ls -lh merged.json
          ls -lh daily_jobs_state.json
      - name: Commit e Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add -f json_parts/ merged.json daily_jobs_state.json
          git commit -m "Atualização automática - 100 vagas por dia" || echo "Nada para commitar"
          git push
